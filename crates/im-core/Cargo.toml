[package]
name = "im-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "im domain model and storage: users, invites, sessions, OIDC material"

[features]
# The domain vocabulary (record shapes, id wrappers) compiles anywhere.
# Everything that touches a database, a password or a CSPRNG lives behind
# `server` (same contract as izlek-core).
default = ["server"]
server = [
  "dep:argon2",
  "dep:base64",
  "dep:chacha20poly1305",
  "dep:data-encoding",
  "dep:hmac",
  "dep:rand",
  "dep:rand_core",
  "dep:rsa",
  "dep:sha1",
  "dep:sha2",
  "dep:sha2-for-rsa",
  "dep:subtle",
  "dep:tokio",
  "dep:turso",
  "dep:ulid",
]

[dependencies]
argon2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
data-encoding = { version = "2.11.1", optional = true }
hmac = { version = "0.13.0", optional = true }
rand = { workspace = true, optional = true }
# rsa 0.9 sits on the rand_core 0.6 / digest 0.10 trait lines, so its RNG
# and its hasher come from those lines, not the workspace's rand 0.10 /
# sha2 0.11. sha2 0.11 stays for token digests.
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
rsa = { version = "0.9.10", optional = true }
sha1 = { version = "0.11.0", optional = true }
sha2 = { workspace = true, optional = true }
sha2-for-rsa = { package = "sha2", version = "0.10", features = ["oid"], optional = true }
subtle = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
turso = { workspace = true, optional = true }
ulid = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
