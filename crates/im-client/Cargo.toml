[package]
name = "im-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "im app-side SDK: the directory mirror (always) and the drop-in OIDC client (feature-gated)"

[features]
default = ["oidc"]
# The drop-in OIDC client half (`mount`/`current_user` + the /auth routes).
# Its routes register through the grammar's inventory, so a binary that
# speaks OIDC through its own client crate builds this crate with
# `default-features = false` and takes only the directory SDK.
oidc = []

[dependencies]
topcoat = { version = "0.6.2", default-features = false, features = [
  "router",
  "cookie",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
chacha20poly1305.workspace = true
# rsa 0.9 verifies through the digest 0.10 traits, so its hasher comes from
# the sha2 0.10 line; the workspace sha2 0.11 stays for PKCE.
sha2-for-rsa = { package = "sha2", version = "0.10", features = ["oid"] }
rsa = "0.9.10"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
  "form",
] }

[[example]]
name = "demo"
# The example mounts the OIDC half; it is not part of the directory-only
# build.
required-features = ["oidc"]

[dev-dependencies]
topcoat = { version = "0.6.2", default-features = false, features = [
  "router",
  "cookie",
  "view",
  "serve",
  "discover",
] }
http = "1.5"
# Tests generate their own RSA keys, and rsa 0.9's RNG is the rand_core 0.6
# line.
rand_core06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
