[package]
name = "im-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "im app-side SDK: the directory mirror (always) and the drop-in OIDC client (feature-gated)"

[features]
default = ["oidc"]
# The drop-in OIDC client half (`mount`/`current_user` + the /auth routes).
# Its routes register through the grammar's inventory, so a binary that
# speaks OIDC through its own client crate builds this crate with
# `default-features = false` and takes only the directory SDK.
oidc = []

[dependencies]
topcoat = { version = "0.8.0", default-features = false, features = [
  "router",
  "cookie",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
chacha20poly1305.workspace = true
# rsa 0.10 verifies through the digest 0.11 traits, so its hasher is the
# workspace sha2 0.11 that PKCE already uses.
rsa = "0.10.0-rc.18"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "form",
] }

[[example]]
name = "demo"
# The example mounts the OIDC half; it is not part of the directory-only
# build.
required-features = ["oidc"]

[dev-dependencies]
topcoat = { version = "0.8.0", default-features = false, features = [
  "router",
  "cookie",
  "view",
  "serve",
  "discover",
] }
http = "1.5"
# Tests generate their own RSA keys, and rsa 0.10's RNG is the rand_core 0.10
# line that the workspace rand 0.10 provides.
rand_core010 = { package = "rand_core", version = "0.10.1" }
